name: connectionyou

services:
  app:
    build: .
    image: connectionyou:2.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASS: ${DB_PASS:?set DB_PASS in .env}
      TZ: Africa/Johannesburg
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/schema:ro
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # 127.0.0.1 only answers once init is finished (the init server runs without networking)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # no ports published; uncomment to reach MySQL from the host
    # ports:
    #   - "3307:3306"

volumes:
  db_data:
